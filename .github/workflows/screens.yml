name: Screenshots only
on: workflow_dispatch
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download latest debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          tag=$(gh api repos/${{ github.repository }}/releases --jq '[.[]|select(.assets|map(.name)|index("app-debug.apk"))][0].tag_name')
          echo "tag=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" -p app-debug.apk -D out -R ${{ github.repository }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r out/app-debug.apk
            python3 tools/screenshots/drive.py shots
      - name: Pack
        if: always()
        run: tar czf screenshots.tgz shots || true
      - name: Attach to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$tag" screenshots.tgz --clobber -R ${{ github.repository }}
